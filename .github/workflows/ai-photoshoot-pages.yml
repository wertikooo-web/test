name: Deploy AI Photoshoot to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'ai-photoshoot-v2/**'
      - '.github/workflows/ai-photoshoot-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build self-contained Pages artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('ai-photoshoot-v2')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')

          # Remove previously injected external enhancement assets.
          for tag in [
              '<link rel="stylesheet" href="lux-enhancements.css">',
              '<link rel="stylesheet" href="busy-indicator.css">',
              '<script src="lux-enhancements.js"></script>',
              '<script src="planner-toggle-fix.js"></script>',
              '<script src="ui-repair.js"></script>'
          ]:
              s=s.replace(tag,'')

          # Use absolute project paths and cache-bust style images.
          version='20260926b'
          s=re.sub(r"assets/styles/([a-z-]+\.jpg)(?:\?v=[^'\" ]+)?", rf"/test/assets/styles/\1?v={version}", s)

          # Inline enhancement CSS/JS so the browser cannot serve stale helper files.
          css='\n'.join((root/f).read_text(encoding='utf-8') for f in ['lux-enhancements.css','busy-indicator.css'])
          js='\n'.join((root/f).read_text(encoding='utf-8') for f in ['lux-enhancements.js','planner-toggle-fix.js','ui-repair.js'])
          s=s.replace('</head>', f'<style id="lux-inline-css">\n{css}\n</style>\n</head>')
          s=s.replace('</body>', f'<script id="lux-inline-js">\n{js}\n</script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-photoshoot-v2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
