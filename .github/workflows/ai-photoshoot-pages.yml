name: Deploy AI Photoshoot to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'ai-photoshoot-v2/**'
      - '.github/workflows/ai-photoshoot-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject LUX enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ai-photoshoot-v2/index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="lux-enhancements.css">'
          busy_css='<link rel="stylesheet" href="busy-indicator.css">'
          js='<script src="lux-enhancements.js"></script>'
          toggle_js='<script src="planner-toggle-fix.js"></script>'
          if css not in s:
              s=s.replace('</head>', css+'\n</head>')
          if busy_css not in s:
              s=s.replace('</head>', busy_css+'\n</head>')
          if js not in s:
              s=s.replace('</body>', js+'\n</body>')
          if toggle_js not in s:
              s=s.replace('</body>', toggle_js+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-photoshoot-v2
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
