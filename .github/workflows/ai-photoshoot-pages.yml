name: Deploy AI Photoshoot to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'ai-photoshoot-v2/**'
      - '.github/workflows/ai-photoshoot-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build self-contained Pages artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('ai-photoshoot-v2')
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')

          for tag in [
              '<link rel="stylesheet" href="lux-enhancements.css">',
              '<link rel="stylesheet" href="busy-indicator.css">',
              '<script src="lux-enhancements.js"></script>',
              '<script src="planner-toggle-fix.js"></script>',
              '<script src="ui-repair.js"></script>',
              '<script src="interaction-fixes.js"></script>',
              '<script src="versioning-controls.js"></script>'
          ]:
              s=s.replace(tag,'')

          version='20260926f'
          s=re.sub(r"(?:/test/)?assets/styles/([a-z-]+\.jpg)(?:\?v=[^'\" ]+)?", rf"assets/styles/\1?v={version}", s)

          s=s.replace(
              '<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>',
              '<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>'
          )

          old="document.getElementById('downloadAll').onclick=async()=>{if(!resultsData.length)return;const zip=new JSZip();resultsData.forEach((r,i)=>zip.file(`lux-${i+1}.png`,r.src.split(',')[1],{base64:true}));const blob=await zip.generateAsync({type:'blob'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai-photoshoot-lux.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};"
          new="document.getElementById('downloadAll').onclick=async()=>{if(!resultsData.length)return;if(typeof JSZip==='undefined'){resultsData.forEach((r,i)=>setTimeout(()=>downloadData(r.src,`lux-${i+1}.png`),i*180));return}const zip=new JSZip();resultsData.forEach((r,i)=>zip.file(`lux-${i+1}.png`,r.src.split(',')[1],{base64:true}));const blob=await zip.generateAsync({type:'blob'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai-photoshoot-lux.zip';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};"
          s=s.replace(old,new)

          marker='<div class="styles" id="styleGrid"></div>'
          fallback='''<div class="styles" id="styleGrid">
            <div class="style selected"><img src="assets/styles/business.jpg?v=20260926f" alt="Business"><div><strong>Business</strong> <small>Деловой портрет</small></div></div>
            <div class="style"><img src="assets/styles/linkedin.jpg?v=20260926f" alt="LinkedIn"><div><strong>LinkedIn</strong> <small>Современный headshot</small></div></div>
            <div class="style"><img src="assets/styles/luxury.jpg?v=20260926f" alt="Luxury"><div><strong>Luxury</strong> <small>Журнальная съёмка</small></div></div>
            <div class="style"><img src="assets/styles/casual.jpg?v=20260926f" alt="Casual"><div><strong>Casual</strong> <small>Естественный lifestyle</small></div></div>
            <div class="style"><img src="assets/styles/travel.jpg?v=20260926f" alt="Travel"><div><strong>Travel</strong> <small>Путешествия</small></div></div>
            <div class="style"><img src="assets/styles/editorial.jpg?v=20260926f" alt="Editorial"><div><strong>Editorial</strong> <small>Журнальный портрет</small></div></div>
            <div class="style"><img src="assets/styles/creative.jpg?v=20260926f" alt="Creative"><div><strong>Creative</strong> <small>Креативный образ</small></div></div>
            <div class="style"><img src="assets/styles/dating.jpg?v=20260926f" alt="Dating"><div><strong>Dating</strong> <small>Тёплый естественный кадр</small></div></div>
          </div>'''
          if marker in s:
              s=s.replace(marker,fallback,1)

          css='\n'.join((root/f).read_text(encoding='utf-8') for f in ['lux-enhancements.css','busy-indicator.css'])
          js='\n'.join((root/f).read_text(encoding='utf-8') for f in ['lux-enhancements.js','planner-toggle-fix.js','ui-repair.js','interaction-fixes.js','versioning-controls.js'])
          s=s.replace('</head>', f'<style id="lux-inline-css">\n{css}\n</style>\n</head>')
          s=s.replace('</body>', f'<script id="lux-inline-js">\n{js}\n</script>\n</body>')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify Pages artifact
        run: |
          test -f ai-photoshoot-v2/index.html
          for f in business linkedin luxury casual travel editorial creative dating; do
            test -s "ai-photoshoot-v2/assets/styles/$f.jpg"
          done
          grep -q 'assets/styles/business.jpg?v=20260926f' ai-photoshoot-v2/index.html
          grep -q 'Сценарий съёмки' ai-photoshoot-v2/lux-enhancements.js
          grep -q 'active-shot planner' ai-photoshoot-v2/interaction-fixes.js
          grep -q 'repeat regeneration' ai-photoshoot-v2/versioning-controls.js
          grep -q 'Удалить все фото' ai-photoshoot-v2/versioning-controls.js
          grep -q 'versioning-controls' ai-photoshoot-v2/index.html || grep -q 'credit ledger' ai-photoshoot-v2/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-photoshoot-v2

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4