name: Apply AI Photoshoot UI and i18n upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-i18n.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-photoshoot/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.drop{display:block;border:1px dashed #575757;border-radius:16px;background:#151515;padding:26px;text-align:center}', '.drop{display:block;border:1px dashed #575757;border-radius:16px;background:#151515;padding:26px;text-align:center;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}.drop:hover{background:#242424;border-color:#f0f0f0;transform:translateY(-1px);box-shadow:0 0 0 2px rgba(255,255,255,.08)}.drop:active{transform:translateY(0);background:#2b2b2b}')
          s=s.replace('.nav{display:flex;gap:16px;align-items:center}', '.nav{display:flex;gap:16px;align-items:center}.lang-switch{display:flex;gap:5px;margin-left:10px}.lang-btn{border:1px solid #d8d2ca;background:transparent;color:#555;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:750;cursor:pointer}.lang-btn:hover{background:#111;color:#fff;border-color:#111}.lang-btn.active{background:#111;color:#fff;border-color:#111}')
          old='<header class="wrap top"><div class="brand">AI Photoshoot</div><nav class="nav"><a href="#styles">Стили</a><a href="#studio">Создать</a></nav></header>'
          new='<header class="wrap top"><div class="brand">AI Photoshoot LUX</div><nav class="nav"><a href="#styles">Стили</a><a href="#studio">Создать</a><div class="lang-switch" aria-label="Language"><button class="lang-btn active" data-lang="ru" type="button">RU</button><button class="lang-btn" data-lang="en" type="button">EN</button><button class="lang-btn" data-lang="ro" type="button">RO</button></div></nav></header>'
          s=s.replace(old,new)
          s=s.replace('<footer class="footer">AI Photoshoot · тестовая версия</footer>', '<footer class="footer">AI Photoshoot LUX ™ 2026 · Kando Connect</footer>')
          marker='</body></html>'
          inject='''\n<script>\n(function(){\nconst D={en:{'Стили':'Styles','Создать':'Create','Ваш личный AI-фотограф':'Your personal AI photographer','Профессиональная фотосессия из ваших фотографий':'Professional photoshoot from your photos','Пять фотографий помогают сохранить внешность. Можно добавить референсы стиля, диктовать правки голосом и обучать следующую генерацию своими оценками.':'Five photos help preserve your appearance. You can add style references, dictate edits by voice, and guide future generations with your ratings.','Создать фотосессию':'Create photoshoot','Выберите стиль':'Choose a style','1. Ваши фотографии':'1. Your photos','Добавьте ровно 5 фотографий':'Add exactly 5 photos','JPG, PNG, WEBP · до 10 MB каждая':'JPG, PNG, WEBP · up to 10 MB each','Лучше использовать разные ракурсы: анфас, три четверти и почти профиль.':'Use different angles: front, three-quarter and near profile.','Референсы стиля, одежды, света или позы · до 3 фото · необязательно':'Style, outfit, lighting or pose references · up to 3 photos · optional','Добавить референсы':'Add references','Эти картинки используются как образец визуального решения. Внешность берётся из пяти основных фото.':'These images are used as visual style references. Appearance is taken from the five main photos.','2. Настройки':'2. Settings','Стиль':'Style','Подача':'Presentation','Авто':'Auto','Женственная':'Feminine','Мужская':'Masculine','Фон':'Background','Одежда':'Outfit','Формат кадра':'Frame format','Количество кадров':'Number of photos','Предпочтительное качество':'Preferred quality','В тестовой версии размер передаётся как пожелание в промпте. Фактический размер выбирает Gemini. Это сделано специально, чтобы не повторялась ошибка API с aspectRatio/imageSize.':'In this test version, size is passed as a preference in the prompt. Gemini chooses the actual output size. This avoids the previous API error with aspectRatio/imageSize.','Дополнительное пожелание или голосовая команда':'Additional request or voice command','Я имею право использовать эти фотографии и согласен создать AI-изображения этого человека.':'I have the right to use these photos and agree to create AI images of this person.','Сгенерировать фотосессию':'Generate photoshoot','Память предпочтений пока пустая.':'Preference memory is empty for now.','Ваши кадры':'Your photos','Скачать всё':'Download all','Деловой портрет':'Business portrait','Современный headshot':'Modern headshot','Журнальная съёмка':'Editorial shoot','Естественный lifestyle':'Natural lifestyle','Путешествия':'Travel','Журнальный портрет':'Editorial portrait','Креативный образ':'Creative look','Тёплый естественный кадр':'Warm natural portrait','Скачать':'Download','Удалить':'Delete','Изменить':'Edit','Перегенерировать':'Regenerate','Нравится':'Like','Не нравится':'Dislike','не похоже':'does not look like me','плохие руки':'bad hands','не тот стиль':'wrong style','плохой фон':'bad background','плохая одежда':'bad outfit','слишком искусственно':'too artificial','Сохранить':'Save','Отмена':'Cancel'},ro:{'Стили':'Stiluri','Создать':'Creează','Ваш личный AI-фотограф':'Fotograful tău AI personal','Профессиональная фотосессия из ваших фотографий':'Ședință foto profesională din fotografiile tale','Пять фотографий помогают сохранить внешность. Можно добавить референсы стиля, диктовать правки голосом и обучать следующую генерацию своими оценками.':'Cinci fotografii ajută la păstrarea aspectului. Poți adăuga referințe de stil, dicta modificări vocal și ghida generările următoare prin evaluări.','Создать фотосессию':'Creează ședința foto','Выберите стиль':'Alege stilul','1. Ваши фотографии':'1. Fotografiile tale','Добавьте ровно 5 фотографий':'Adaugă exact 5 fotografii','JPG, PNG, WEBP · до 10 MB каждая':'JPG, PNG, WEBP · până la 10 MB fiecare','Лучше использовать разные ракурсы: анфас, три четверти и почти профиль.':'Folosește unghiuri diferite: frontal, trei sferturi și aproape profil.','Референсы стиля, одежды, света или позы · до 3 фото · необязательно':'Referințe pentru stil, haine, lumină sau poză · până la 3 fotografii · opțional','Добавить референсы':'Adaugă referințe','Эти картинки используются как образец визуального решения. Внешность берётся из пяти основных фото.':'Aceste imagini sunt folosite ca referințe vizuale. Aspectul este preluat din cele cinci fotografii principale.','2. Настройки':'2. Setări','Стиль':'Stil','Подача':'Prezentare','Авто':'Auto','Женственная':'Feminină','Мужская':'Masculină','Фон':'Fundal','Одежда':'Ținută','Формат кадра':'Format cadru','Количество кадров':'Număr de fotografii','Предпочтительное качество':'Calitate preferată','В тестовой версии размер передаётся как пожелание в промпте. Фактический размер выбирает Gemini. Это сделано специально, чтобы не повторялась ошибка API с aspectRatio/imageSize.':'În versiunea de test, dimensiunea este transmisă ca preferință în prompt. Gemini alege dimensiunea reală. Astfel evităm eroarea API anterioară cu aspectRatio/imageSize.','Дополнительное пожелание или голосовая команда':'Cerință suplimentară sau comandă vocală','Я имею право использовать эти фотографии и согласен создать AI-изображения этого человека.':'Am dreptul să folosesc aceste fotografii și sunt de acord să creez imagini AI ale acestei persoane.','Сгенерировать фотосессию':'Generează ședința foto','Память предпочтений пока пустая.':'Memoria preferințelor este goală deocamdată.','Ваши кадры':'Fotografiile tale','Скачать всё':'Descarcă tot','Деловой портрет':'Portret business','Современный headshot':'Portret profesional modern','Журнальная съёмка':'Ședință editorială','Естественный lifestyle':'Lifestyle natural','Путешествия':'Călătorii','Журнальный портрет':'Portret editorial','Креативный образ':'Imagine creativă','Тёплый естественный кадр':'Portret natural și cald','Скачать':'Descarcă','Удалить':'Șterge','Изменить':'Modifică','Перегенерировать':'Regenerează','Нравится':'Îmi place','Не нравится':'Nu îmi place','не похоже':'nu seamănă','плохие руки':'mâini nereușite','не тот стиль':'stil nepotrivit','плохой фон':'fundal nereușit','плохая одежда':'ținută nereușită','слишком искусственно':'prea artificial','Сохранить':'Salvează','Отмена':'Anulează'}};\nconst O=new WeakMap();function tr(root,lang){const dict=lang==='ru'?null:D[lang];const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=n.nodeValue.trim();if(!t)continue;if(!O.has(n))O.set(n,n.nodeValue);const base=O.get(n),key=base.trim();if(!dict)n.nodeValue=base;else if(dict[key]!==undefined)n.nodeValue=base.replace(key,dict[key]);}root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(!el.dataset.ruPlaceholder)el.dataset.ruPlaceholder=el.placeholder;const b=el.dataset.ruPlaceholder;const pm={en:{'Вставьте Gemini API key':'Enter Gemini API key','Например: светлая студия, Токио вечером':'For example: bright studio, Tokyo at night','Например: тёмный костюм, белая рубашка':'For example: dark suit, white shirt','Например: мягкий дневной свет, естественная кожа':'For example: soft daylight, natural skin'},ro:{'Вставьте Gemini API key':'Introdu cheia API Gemini','Например: светлая студия, Токио вечером':'De exemplu: studio luminos, Tokyo seara','Например: тёмный костюм, белая рубашка':'De exemplu: costum închis, cămașă albă','Например: мягкий дневной свет, естественная кожа':'De exemplu: lumină naturală blândă, piele naturală'}};el.placeholder=lang==='ru'?b:((pm[lang]&&pm[lang][b])||b);});}\nfunction setLang(l){localStorage.setItem('aiPhotoshootLang',l);document.documentElement.lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));tr(document.body,l)}\ndocument.querySelectorAll('.lang-btn').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));new MutationObserver(()=>{const l=localStorage.getItem('aiPhotoshootLang')||'ru';if(l!=='ru')tr(document.body,l)}).observe(document.body,{childList:true,subtree:true});setLang(localStorage.getItem('aiPhotoshootLang')||'ru');\n})();\n</script>\n'''
          if 'const D={en:' not in s:
              s=s.replace(marker, inject+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-photoshoot/index.html
          git diff --cached --quiet || git commit -m "Add RU EN RO interface and upload hover states"
          git push
