name: Fix Gemini image request
on:
  push:
    paths:
      - '.github/workflows/fix-gemini-format.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini request
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai-photoshoot/index.html')
          s = p.read_text()
          old = "const body={contents:[{parts}],generationConfig:{responseModalities:['IMAGE'],responseFormat:{image:{aspectRatio:ratio,imageSize:'1K'}}}};"
          new = "const body={contents:[{parts}],generationConfig:{responseModalities:['IMAGE']}};"
          if old not in s:
              raise SystemExit('Target code not found')
          p.write_text(s.replace(old,new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-photoshoot/index.html
          git commit -m "Fix Gemini image generation request"
          git push
