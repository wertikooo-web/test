name: Patch quick ideas
on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_quick_ideas.py'
      - '.github/workflows/patch-quick-ideas.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_quick_ideas.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-photoshoot-v2/lux-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m "Refine shot planner quick ideas"
          git push
