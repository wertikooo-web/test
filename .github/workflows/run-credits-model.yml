name: Run credits model patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-credits-model.yml'
      - '.github/scripts/apply_credits_model.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/apply_credits_model.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-photoshoot/index.html
          git diff --cached --quiet || git commit -m "Apply credits monetization model"
          git push
