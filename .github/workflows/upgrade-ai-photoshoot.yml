name: Upgrade AI Photoshoot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-ai-photoshoot.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ai-photoshoot/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.drop{border:', '.drop{display:block;border:')
          s=s.replace('<select id="count"><option value="4">4</option><option value="8">8</option></select>', '<select id="count"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select>')
          marker='<div class="field"><label>Количество кадров</label><select id="count"><option value="2">2</option><option value="4" selected>4</option><option value="8">8</option></select></div>'
          if 'id="resolution"' not in s:
              s=s.replace(marker, marker+'<div class="field"><label>Разрешение</label><select id="resolution"><option value="1K">1K · стандарт</option><option value="2K" selected>2K · лучшее качество, та же себестоимость</option><option value="4K">4K · для печати / premium</option></select></div>')

          s=s.replace('<div id="resultsWrap" class="hidden"><h3 style="margin-top:32px">Ваши кадры</h3><div class="results" id="results"></div></div>', '<div id="resultsWrap" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap"><h3 style="margin:0">Ваши кадры</h3><button class="btn secondary" id="downloadAll" style="border-color:#fff;color:#fff">Скачать всё</button></div><div class="results" id="results"></div></div>')
          if 'jszip.min.js' not in s:
              s=s.replace('<script>\nconst styles=', '<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>\n<script>\nconst styles=')
          s=s.replace('.result .bar{padding:10px;display:flex;justify-content:space-between;gap:8px}.result .bar button{background:#fff;border:0;border-radius:10px;padding:8px 10px}', '.result .bar{padding:10px;display:flex;flex-wrap:wrap;gap:8px}.result .bar button{background:#fff;border:0;border-radius:10px;padding:8px 10px}.result .bar .danger{background:#3a1717;color:#fff}.result.busy{opacity:.55;pointer-events:none}')

          start=s.index('function buildPrompt')
          end=s.index("const saved=sessionStorage.getItem('geminiKey');")
          tail_end=s.index('</script>', end)
          new_js=r'''function buildPrompt(style,index,customEdit=''){
 const bg=document.getElementById('background').value.trim(),outfit=document.getElementById('outfit').value.trim(),extra=document.getElementById('prompt').value.trim(),gender=document.getElementById('gender').value;
 return `Create ONE new photorealistic professional photoshoot image of the SAME single person shown across the reference photos. Preserve facial identity, apparent age, facial proportions, eye shape, nose, lips, skin tone and distinctive features with very high fidelity. Do not combine faces and do not create multiple people. Style: ${style.prompt}. Presentation: ${gender}. ${bg?`Background: ${bg}.`:''} ${outfit?`Outfit: ${outfit}.`:''} ${extra}. ${customEdit?`Requested edit: ${customEdit}. Keep everything else as close as possible to the supplied current image.`:`Shot variation ${index+1}: use a different natural pose, framing and expression while keeping identity consistent.`} Professional camera, believable skin texture, realistic hands, anatomically correct fingers, natural hair, no text.`
}
async function generateOne(key,prompt,ratio,refs,size){
 const parts=[{text:prompt},...refs.map(r=>({inline_data:{mime_type:r.mime,data:r.data}}))];
 const body={contents:[{parts}],generationConfig:{responseModalities:['IMAGE'],responseFormat:{image:{aspectRatio:ratio,imageSize:size}}}};
 const resp=await fetch('https://generativelanguage.googleapis.com/v1/models/gemini-3-pro-image:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
 if(!resp.ok){let msg='Ошибка Gemini API';try{const j=await resp.json();msg=j.error?.message||msg}catch{}throw new Error(msg)}
 const j=await resp.json(),partsOut=j.candidates?.[0]?.content?.parts||[],img=partsOut.find(p=>p.inlineData||p.inline_data),data=img?.inlineData?.data||img?.inline_data?.data,mime=img?.inlineData?.mimeType||img?.inline_data?.mime_type||'image/png';
 if(!data)throw new Error('Gemini не вернул изображение. Попробуйте другой набор фото или формулировку.');
 return `data:${mime};base64,${data}`
}
function dataUrlRef(src){const [meta,data]=src.split(',');return {mime:(meta.match(/data:([^;]+)/)||[])[1]||'image/png',data}}
let generated=[],lastRefs=[],lastStyle=null;
function renderResults(){
 const box=document.getElementById('results');box.innerHTML='';
 generated.forEach((item,i)=>{const d=document.createElement('div');d.className='result';d.innerHTML=`<img src="${item.src}" alt="Generated photo ${i+1}"><div class="bar"><button class="down">Скачать</button><button class="regen">Перегенерировать</button><button class="edit">Изменить</button><button class="danger del">Удалить</button></div>`;
 d.querySelector('.down').onclick=()=>downloadOne(item.src,i+1);
 d.querySelector('.del').onclick=()=>{generated.splice(i,1);renderResults();if(!generated.length)document.getElementById('resultsWrap').classList.add('hidden')};
 d.querySelector('.regen').onclick=()=>regenerateAt(i,d);
 d.querySelector('.edit').onclick=()=>editAt(i,d);
 box.appendChild(d)
 });
}
function addResult(src){generated.push({src});document.getElementById('resultsWrap').classList.remove('hidden');renderResults()}
function downloadOne(src,n){const a=document.createElement('a');a.href=src;a.download=`ai-photoshoot-${n}.png`;document.body.appendChild(a);a.click();a.remove()}
async function downloadAll(){if(!generated.length)return;const b=document.getElementById('downloadAll');b.disabled=true;b.textContent='Готовлю ZIP…';try{const zip=new JSZip();generated.forEach((x,i)=>zip.file(`ai-photoshoot-${i+1}.png`,x.src.split(',')[1],{base64:true}));const blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-photoshoot.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}finally{b.disabled=false;b.textContent='Скачать всё'}}
document.getElementById('downloadAll').onclick=downloadAll;
async function regenerateAt(i,card){const key=document.getElementById('apiKey').value.trim();if(!key||!lastRefs.length)return;card.classList.add('busy');const status=document.getElementById('status');try{status.textContent=`Перегенерирую кадр ${i+1}…`;const img=await generateOne(key,buildPrompt(lastStyle,Date.now()%1000),document.getElementById('ratio').value,lastRefs,document.getElementById('resolution').value);generated[i].src=img;renderResults();status.textContent='Кадр заменён.'}catch(e){status.textContent='Ошибка: '+e.message}finally{card.classList.remove('busy')}}
async function editAt(i,card){const instruction=prompt('Что изменить в этом фото? Например: «сделай фон светлее», «белая рубашка», «убери очки», «оставь лицо, поменяй позу».');if(!instruction)return;const key=document.getElementById('apiKey').value.trim();if(!key)return;card.classList.add('busy');const status=document.getElementById('status');try{status.textContent=`Вношу изменение в кадр ${i+1}…`;const refs=[dataUrlRef(generated[i].src),...lastRefs.slice(0,4)];const img=await generateOne(key,buildPrompt(lastStyle,i,instruction),document.getElementById('ratio').value,refs,document.getElementById('resolution').value);generated[i].src=img;renderResults();status.textContent='Изменение готово.'}catch(e){status.textContent='Ошибка: '+e.message}finally{card.classList.remove('busy')}}
document.getElementById('generate').onclick=async()=>{const key=document.getElementById('apiKey').value.trim(),status=document.getElementById('status'),btn=document.getElementById('generate');if(files.length!==5){status.textContent='Нужно загрузить ровно 5 фотографий.';return}if(!key){status.textContent='Вставьте Gemini API key.';return}if(!document.getElementById('consent').checked){status.textContent='Нужно подтвердить согласие на использование фотографий.';return}sessionStorage.setItem('geminiKey',key);btn.disabled=true;generated=[];renderResults();document.getElementById('resultsWrap').classList.remove('hidden');try{status.textContent='Подготавливаю 5 референсов…';lastRefs=await Promise.all(files.map(async f=>({mime:f.type,data:await toBase64(f)})));lastStyle=styles.find(s=>s.id===selected);const count=+document.getElementById('count').value,ratio=document.getElementById('ratio').value,size=document.getElementById('resolution').value;for(let i=0;i<count;i++){status.textContent=`Создаю кадр ${i+1} из ${count} · ${size}…`;const img=await generateOne(key,buildPrompt(lastStyle,i),ratio,lastRefs,size);addResult(img)}status.textContent='Готово. Можно скачать все, удалить, изменить или перегенерировать любой кадр.'}catch(err){status.textContent='Ошибка: '+err.message}finally{btn.disabled=false}};
const saved=sessionStorage.getItem('geminiKey');if(saved)document.getElementById('apiKey').value=saved;
'''
          s=s[:start]+new_js+s[tail_end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit upgrade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-photoshoot/index.html
          git commit -m "Upgrade AI Photoshoot controls" || exit 0
          git push
